name: Claude Review

# 対象リポジトリの .github/workflows/claude-review.yml として配置する caller workflow．
# 書き換えるのは md-lint.yml と同じ 2 箇所：
#   - `OWNER` を利用する github-workflows のオーナー名に置き換える．
#   - `@<SHA>` を利用したい github-workflows のコミット SHA に置き換える．
# 参照先（@ 以降）の選び方は templates/.github/workflows/md-lint.yml の説明と同じ．
#
# 事前準備（caller 配置に加えて必要なもの）：
#   - Claude GitHub App（https://github.com/apps/claude）のインストール．
#   - `claude setup-token` で発行した OAuth トークンを
#     リポジトリ Secrets の `CLAUDE_CODE_OAUTH_TOKEN` へ登録する．
#     例: gh secret set CLAUDE_CODE_OAUTH_TOKEN -R OWNER/REPO
#
# 起動はメンション方式である．PR のコメントに @claude を含めると発火する．
#
# 発火条件は event ごとに違う（Issue #197 で実測）．
#   - issue_comment（PR の会話タブ）は default ブランチに workflow がある
#     場合のみ発火する．本ファイルを追加した PR 自身の上では発火しない．
#   - pull_request_review_comment（diff 行へのレビューコメント）は
#     PR 側の定義で発火する．default ブランチに無くてよい．
# 後者により，同一リポジトリの branch から作った PR なら，その PR 自身の
# diff 行へ @claude を含むレビューコメントを投稿して動作確認できる．
# 会話タブでの確認はマージ後の別 PR で行う．
#
# 限定が 2 つある．
#   - fork からの PR では使えない．発火の有無を確認しておらず，加えて
#     fork 由来の run には secret が渡らず GITHUB_TOKEN も read-only になる．
#   - 公式ドキュメントの記述とは食い違う挙動である．2026-09-07 時点の観測で
#     あり，GitHub が文書どおりへ揃えれば使えなくなる．
#
# @claude を含まないコメントでも run は作られ，skipped で終わる．これは正常で
# ある．run は on: が event に一致した時点で作られ，メンション判定は呼ばれる側
# の job の if: が行うためである．skipped は runner 時間を消費しない．
# 「無反応」を疑うときは，run が skipped か failure かを先に見る．

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# reusable workflow 側の宣言は本 caller の付与を超えられないため，
# 必要な権限は caller で明示する．
permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  actions: read # PR の CI 結果を Claude が読むために必要

jobs:
  claude:
    uses: OWNER/github-workflows/.github/workflows/claude-review.yml@<SHA> # v2
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
