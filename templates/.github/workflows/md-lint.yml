name: Markdown Lint

# 対象リポジトリの .github/workflows/md-lint.yml として配置する caller workflow．
# 以下 2 箇所のみ利用者が書き換える：
#   - `OWNER` を利用する github-workflows のオーナー名に置き換える．
#     （tomio2480 を直接利用するなら OWNER → tomio2480．自分でフォークした場合は自分のユーザー名）
#   - `@<SHA>` を利用したい github-workflows のコミット SHA に置き換える．
#
# 参照先（@ 以降）の選び方：
#   - 既定: `@<SHA> # v2` 形式で SHA pin とバージョンコメントを併記する．
#     Dependabot が SHA とバージョンの両方を自動追随し，更新は PR で通知される．
#     本テンプレはこの方式を推奨．
#     版コメントは major のみを書く．patch 番号を書くと，中央がテンプレを
#     触らないリリースを出すたびに 1 世代ずれ続けるためである．
#     pin した SHA の正確な版は `git tag --points-at` で引ける．
#   - 代替 1: `@main` — 中央の最新 commit を即時反映．Dependabot による更新検知は働かない．
#     中央 repo の書き換えが即時反映される点に同意できる場合のみ．
#   - 代替 2: `@<SHA> # v2.0.0` 形式 — 完全不変．パッチ追随も止めて固定したい場合．
#
# v1 系（`@v1` / `@v1.0.0` 等）は self-detection bug により動作しません．
# 必ず v2 以降を参照してください（詳細は中央 repo の README）．
#
# 設定ファイル（.markdownlint-cli2.yaml / .textlintrc.json / prh.yml）は
# 呼び出し側に存在すればそれが優先される．無ければ参照先 commit の標準設定が使われる．
# .textlint-allowlist.yml / .prh-extra.yml は置き換えではなく加算で，存在するときだけ効く．

on:
  pull_request:
    paths:
      - "**/*.md"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: md-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Markdown Lint via composite action
        uses: OWNER/github-workflows/.github/actions/markdown-lint@<SHA> # v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # 必要に応じて inputs で上書き可能．詳細は中央リポジトリの README を参照．
          # node-version: "22"              # Maintenance LTS に下げる例
          # markdown-glob: "docs/**/*.md"   # 対象ディレクトリを絞る例
          # filter-mode: "nofilter"         # 既存ファイル全体を指摘したい場合
          # post-summary: "false"           # 同一 PR で複数 job が並走するときの marker 競合回避
          # markdown-ignore: |              # summary 件数から除外する path glob（改行区切り）
          #   tests/fixtures/**             #   reviewdog の inline コメント側には影響しない
          # upload-reports: "false"         # 生レポートの artifact 添付をやめる（既定は true）
          # report-artifact-name: "lint-reports-docs"  # matrix 等で artifact 名が衝突する場合