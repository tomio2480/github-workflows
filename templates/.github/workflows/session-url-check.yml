name: Session URL Check

# 対象リポジトリの .github/workflows/session-url-check.yml として配置する caller workflow．
# `OWNER` を利用する github-workflows のオーナー名へ置換する．
# `@<SHA>` は利用したい github-workflows の確定 commit SHA へ置換する．
#
# Claude Code が cloud / Remote Control セッションから作る commit と PR には，
# 既定でセッション URL（claude.ai/code/session_…）が付く．公開 repo の履歴へ
# 残ると commit 検索で横断的に集められるため，PR の段階で止める blocking gate．
# 発生源の抑止は Claude Code 側の設定 attribution.sessionUrl=false である
# （中央 repo の docs/session-url-check.md を参照）．
#
# `edited` を含めるのは，PR 本文の後編集で URL が入るケースを拾うためである．

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: session-url-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Session URL Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check for Claude session URLs via composite action
        uses: OWNER/github-workflows/.github/actions/session-url-check@<SHA> # v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
