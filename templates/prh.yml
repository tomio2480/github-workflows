# prh（proofreading helper）辞書
# 表記ゆれを統一するためのルールを記述する．
# 気づいたゆれは随時このファイルに追加し，辞書を育てる．
version: 1

rules:
  # プラットフォーム・サービス名
  - expected: GitHub
    patterns:
      - Github
      - github
      - GITHUB

  - expected: GitLab
    patterns:
      - Gitlab
      - gitlab

  - expected: JavaScript
    patterns:
      - Javascript
      - javascript
      - JAVASCRIPT
      # `JS` は word boundary 付きの regex で書く．
      # plain string で書くと substring match が効き，`JSON` 等にも誤マッチする．
      - /\bJS\b/
    prh:
      - specs:
          - from: JS
            to: JavaScript

  - expected: TypeScript
    patterns:
      - Typescript
      - typescript
      - TYPESCRIPT

  - expected: Node.js
    patterns:
      - /[Nn]ode\.JS/
      - NodeJS
      - nodejs

  - expected: Markdown
    patterns:
      - markdown
      - MARKDOWN
      - マークダウン

  - expected: Pull Request
    patterns:
      - pull request
      - pullrequest
      - プルリクエスト
      - プルリク

  # 技術系頻出単語
  # 長音「ー」で終わる語は plain string だと，正しい表記内の部分文字列にも
  # substring match して誤検出する（Issue #33・#48 で観測）．
  # 否定先読み `(?!ー)` で長音が続く場合を除外する設計で統一する．
  - expected: サーバー
    # plain string `サーバ` だと「サーバー」内の「サーバ」にも誤検出する
    # （Issue #48・tomio2480/settings PR #92 で観測）．ユーザー と同様の対応．
    patterns:
      - /サーバ(?!ー)/
    specs:
      - from: サーバ環境
        to: サーバー環境
      - from: サーバー環境
        to: サーバー環境

  - expected: ユーザー
    # plain string `ユーザ` だと substring match で「ユーザー」内の「ユーザ」にも
    # ヒットして誤検出する（Issue #33・tomio2480/settings PR #37 で 8 件観測）．
    # 否定先読み `(?!ー)` で「ユーザー」を除外する．
    patterns:
      - /ユーザ(?!ー)/
    specs:
      - from: ユーザ登録
        to: ユーザー登録
      - from: ユーザー登録
        to: ユーザー登録

  - expected: コンピューター
    # plain string `コンピュータ` だと「コンピューター」内の「コンピュータ」にも
    # 誤検出する（ユーザー・サーバー と同様の問題）．
    # 否定先読み `(?!ー)` で「コンピューター」を除外する．
    patterns:
      - /コンピュータ(?!ー)/
    specs:
      - from: コンピュータ科学
        to: コンピューター科学
      - from: コンピューター科学
        to: コンピューター科学

  # 文末表現（省略形を正式名へ）
  - expected: できる
    patterns:
      - 出来る

  - expected: ください
    patterns:
      - 下さい

  # LLM 定型句の抑制（Issue #54）
  # LLM が生成しがちな空虚な定型表現を検出する．出典と収録基準は
  # https://github.com/tomio2480/github-workflows/blob/main/docs/rule-rationale.md
  # の「LLM 定型句の抑制」節を参照．
  # 過剰マッチは caller 側 .textlint-allowlist.yml で個別除外できる．
  #
  # 機械置換できる 2 語（不可欠・に他ならない）は expected に置換先を書く．
  # それ以外の expected は（）付きのガイダンス文字列であり自動置換に適さない．
  # textlint --fix をローカル実行する場合は本節の diff を確認して手で書き換える．
  # 本 action の CI 経路（checkstyle → reviewdog）では fix 情報は使われず
  # メッセージ表示のみのため影響しない．

  - expected: 必要
    # 「必要不可欠」を先に長一致させ，「必要必要」への二重置換を防ぐ．
    # 否定戻り読み `(?<!必要)` で「必要不可欠」内の「不可欠」への重複検出を除外する．
    patterns:
      - /必要不可欠|(?<!必要)不可欠/
    prh: 形容だけの強調を避ける．必要である理由か根拠を書く（LLM 定型句）
    specs:
      - from: 必要不可欠な手順
        to: 必要な手順
      - from: 不可欠な手順
        to: 必要な手順

  - expected: である
    # ひらがな表記「にほかならない」も同一の定型句として検出する．
    patterns:
      - /に(?:他|ほか)ならない/
    prh: 断定の演出を避ける．平叙に書く（LLM 定型句）
    specs:
      - from: 設計判断に他ならない
        to: 設計判断である
      - from: 設計判断にほかならない
        to: 設計判断である

  - expected: （論点を直接書く）
    patterns:
      - 重要なのは
    prh: 空虚な前置きを置かない（LLM 定型句）

  - expected: （扱い方を具体的に書く）
    # 「正面から見る」等の物理的・字義的な用法を誤検出しないよう，
    # 定型句で使われる動詞（扱う・向き合う・取り組む・回収する）に限定する．
    patterns:
      - /正面から(扱|向き合|取り組|回収)/
    prh: 空虚な前置きを置かない（LLM 定型句）

  - expected: （具体的な理由か事実で置き換える）
    patterns:
      - 核心的
    prh: 形容だけの強調を避ける（LLM 定型句）

  - expected: （対象と扱い方を具体的に書く）
    patterns:
      - 掘り下げ
    prh: 内容を示さない動詞でごまかさない（LLM 定型句）

  - expected: （対象と扱い方を具体的に書く）
    patterns:
      - 深掘り
    prh: 内容を示さない動詞でごまかさない（LLM 定型句）

  # 全角記号前後の半角スペース禁止（Issue #15 stage 2）
  # JTF 日本語標準スタイルガイドに基づき，4 シンボル（中黒・全角スラッシュ・
  # 全角コロン・波ダッシュ）の前後に半角スペースを入れない．
  # patterns は ASCII 半角スペースに限定する（`\s` は改行・タブも拾い
  # 箇条書き構造で偽陽性が出るため使わない）．量指定子 `+` でシングルスペースに
  # 加えてダブルスペース等の typo も検出する．`/ +X +| +X|X +/` の長い順
  # alternation で「両側／前のみ／後のみ」 の 3 形態を 1 本で扱う．
  # 同一 rule 内の複数 pattern は prh が内部で alternation に合成するため，
  # leftmost-longest が機能するこの 1 本記法に統一している．
  - expected: ・
    patterns:
      - / +・ +| +・|・ +/
    prh: 全角中黒「・」の前後に半角スペースを入れない（JTF スタイル）
    specs:
      - from: CI ・ cron
        to: CI・cron
      - from: 日本語 ・英語
        to: 日本語・英語
      - from: a・ b
        to: a・b

  - expected: ／
    patterns:
      - / +／ +| +／|／ +/
    prh: 全角スラッシュ「／」の前後に半角スペースを入れない（JTF スタイル）
    specs:
      - from: hatena ／ note
        to: hatena／note
      - from: source ／url
        to: source／url
      - from: url／ title
        to: url／title

  - expected: ：
    patterns:
      - / +： +| +：|： +/
    prh: 全角コロン「：」の前後に半角スペースを入れない（JTF スタイル）
    specs:
      - from: Title ： Value
        to: Title：Value
      - from: key ：value
        to: key：value
      - from: key： value
        to: key：value

  - expected: 〜
    patterns:
      - / +〜 +| +〜|〜 +/
    prh: 波ダッシュ「〜」の前後に半角スペースを入れない（JTF スタイル）
    specs:
      - from: 2025-08-30 〜 2026-04-13
        to: 2025-08-30〜2026-04-13
      - from: A 〜B
        to: A〜B
      - from: A〜 B
        to: A〜B
