version: 2

# GitHub Actions の依存を週次で更新する．
# SHA ピンしているアクションも Dependabot が自動で PR を起票する．
#
# github-actions エコシステム: `directory: /` が走査するのは `.github/workflows/` と
# リポジトリ直下の action.yml だけである．本リポジトリの配布物の中心である
# `.github/actions/<name>/action.yml` は，明示しない限り走査されない（Issue #153）．
# ワイルドカードを使うため `directories`（複数形）で宣言する．`directory`（単数形）は
# glob に対応しない．composite action を増やしても追随する．
#
# npm エコシステム: .github/actions/markdown-lint/ の package-lock.json を追跡する．
# markdownlint-cli2・textlint 等の npm パッケージバージョンを固定し，
# Dependabot で更新 PR を自動起票する．group は lint 系統ごとに分け，
# 片系統の挙動変化をもう片方の更新と切り離してレビューできるようにする．
#
# 更新 PR は手動レビューのうえマージする．第三者アクションの挙動変化に注意．

updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /.github/actions/markdown-lint
    schedule:
      interval: weekly
    groups:
      textlint:
        patterns:
          - "textlint*"
      markdownlint:
        patterns:
          - "markdownlint*"
