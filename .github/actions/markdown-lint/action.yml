name: "Markdown Lint (composite action)"
description: "reviewdog で markdownlint と textlint を caller 側 PR に inline コメントとして投稿する composite action"

# 設計のポイント:
#   - $GITHUB_ACTION_PATH 経由で action 自身のチェックアウト先絶対パスを取り，中央 templates へ
#     アクセスする．`actions/checkout` での自リポジトリ二重取得は不要．
#   - 呼び出し側に設定ファイル（.markdownlint-cli2.yaml / .textlintrc.json / prh.yml）があれば
#     そちらを優先する．無ければ中央 templates の同名ファイルを使う．
#   - 呼び出し側の .textlint-allowlist.yml / .prh-extra.yml は「置き換え」ではなく
#     「加算」の設定であり，存在するときだけ中央設定へ足す．
#   - third-party action は full commit SHA でピンする．
#   - reviewdog の PR レビュー投稿には GITHUB_TOKEN が必要なため caller から `github-token`
#     input で明示的に受け取る．composite では secrets.* が使えないため．

inputs:
  node-version:
    description: "利用する Node.js のバージョン（デフォルトは Active LTS）"
    default: "24"
  markdown-glob:
    description: "lint 対象の glob パターン"
    default: "**/*.md"
  filter-mode:
    description: "reviewdog のフィルタモード（added / diff_context / file / nofilter）"
    default: "added"
  level:
    description: "reviewdog のレベル（info / warning / error）"
    default: "warning"
  fail-on-error:
    description: "lint 指摘で job を失敗させるか．false なら指摘では失敗しない（checkout/setup 等の実行エラーは通常どおり失敗）"
    default: "false"
  github-token:
    description: "reviewdog が PR レビューコメント投稿に使う GitHub token．caller 側で secrets.GITHUB_TOKEN を with で渡す"
    required: true
  pyyaml-version:
    description: "明示的に install する PyYAML のバージョン番号（例: 6.0.2）．内部で pyyaml==<value> として渡されるため == 等の比較子は付けない．空のときは ubuntu-latest プリインストールの PyYAML をそのまま使う．self-hosted runner や再現性を重視する caller のための逃げ道"
    default: ""
  post-summary:
    description: "PR に lint summary コメントを upsert するかどうか．`true`（既定）なら hidden marker 付きのコメントを 1 件 upsert する．同一 PR で複数 job が並走するなど marker 競合を避けたい場合に `false` を指定する．reviewdog の inline コメント投稿には影響しない"
    default: "true"
  markdown-ignore:
    description: "summary 件数の集計から除外する path glob．改行区切りで複数指定可．`tests/fixtures/**` のような prefix 形式で，相対・絶対両方のパスを除外する．reviewdog の inline コメントは別経路で `filter-mode` により制御されるため本 input の影響を受けない．自リポジトリの dogfooding で fixture を summary から外す等の用途を想定"
    default: ""

runs:
  using: composite
  steps:
    - name: Indicate review start (👀 reaction on PR)
      # PR 上に「いま review 動いてるよ」のサインを最初に出す．無いと caller 視点では
      # workflow が起動したのか lint config 解決で詰まったのか判別できない．
      # 失敗してもレビュー本体は続行する（reviewdog 投稿が本命のため UX nicety を理由に
      # job を落とさない）．実装は scripts/add-pr-reaction.sh に委譲し bats で単体
      # テストする．composite action 自身のチェックアウトパスは $GITHUB_ACTION_PATH
      # から取り，スクリプトを相対参照で実行する（caller checkout 非依存）．
      # ACTION_PATH は絶対パスのため cd/pwd での再正規化は不要．スクリプト側で
      # set -uo pipefail / 必須 env 検証 / fail-open exit を担うため step では
      # bash 起動 1 行のみ．
      if: github.event_name == 'pull_request'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: bash "${ACTION_PATH}/../../../scripts/add-pr-reaction.sh"

    - name: Resolve config file paths
      id: cfg
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        # action_path = .../.github/actions/markdown-lint
        # ${ACTION_PATH}/../../../templates / scripts でリポジトリルート起点に到達できる．
        # OS 側で `..` セグメントが解決されるため cd/pwd で正規化する必要はない．
        TEMPLATES="${ACTION_PATH}/../../../templates"
        RESOLVE="${ACTION_PATH}/../../../scripts/resolve-config-path.sh"

        MDLINT_CFG="$(bash "${RESOLVE}" .markdownlint-cli2.yaml "${TEMPLATES}")"
        TEXTLINT_CFG="$(bash "${RESOLVE}" .textlintrc.json "${TEMPLATES}")"
        TEXTLINT_IGNORE="$(bash "${RESOLVE}" .textlintignore "${TEMPLATES}")"
        PRH_CFG="$(bash "${RESOLVE}" prh.yml "${TEMPLATES}")"

        # caller root の .textlint-allowlist.yml は optional．存在すれば絶対パスを，
        # 無ければ空文字を出力する．resolve-config-path.sh は「無ければ中央テンプレを返す」
        # 規約のため allowlist には流用せず inline でハンドリングする．
        if [ -f .textlint-allowlist.yml ]; then
          ALLOWLIST_CFG="$(pwd)/.textlint-allowlist.yml"
          echo "caller allowlist:    ${ALLOWLIST_CFG}"
        else
          ALLOWLIST_CFG=""
          echo "caller allowlist:    (not configured)"
        fi

        # caller root の .prh-extra.yml も optional（Issue #91）．存在すれば中央 prh.yml に
        # 加算する追加辞書として絶対パスを渡し，無ければ空文字で「加算なし」を表す．
        # caller root の prh.yml（置き換え）とは独立に働く．
        if [ -f .prh-extra.yml ]; then
          PRH_EXTRA_CFG="$(pwd)/.prh-extra.yml"
          echo "caller prh extra:    ${PRH_EXTRA_CFG}"
        else
          PRH_EXTRA_CFG=""
          echo "caller prh extra:    (not configured)"
        fi

        echo "mdlint=${MDLINT_CFG}" >> "${GITHUB_OUTPUT}"
        echo "textlint=${TEXTLINT_CFG}" >> "${GITHUB_OUTPUT}"
        echo "textlint_ignore=${TEXTLINT_IGNORE}" >> "${GITHUB_OUTPUT}"
        echo "prh=${PRH_CFG}" >> "${GITHUB_OUTPUT}"
        echo "allowlist=${ALLOWLIST_CFG}" >> "${GITHUB_OUTPUT}"
        echo "prh_extra=${PRH_EXTRA_CFG}" >> "${GITHUB_OUTPUT}"
        echo "markdownlint config: ${MDLINT_CFG}"
        echo "textlint config:     ${TEXTLINT_CFG}"
        echo "textlint ignore:     ${TEXTLINT_IGNORE}"
        echo "prh dictionary:      ${PRH_CFG}"

    - name: Generate runtime textlint config with resolved prh path
      id: textlint_runtime
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        SRC: ${{ steps.cfg.outputs.textlint }}
        PRH: ${{ steps.cfg.outputs.prh }}
        ALLOWLIST: ${{ steps.cfg.outputs.allowlist }}
        PRH_EXTRA: ${{ steps.cfg.outputs.prh_extra }}
        PYYAML_VERSION: ${{ inputs.pyyaml-version }}
      run: |
        set -euo pipefail
        # caller cwd に依存せず確実に共有できる RUNNER_TEMP 配下に絶対パスで書き出す．
        DEST="${RUNNER_TEMP}/textlintrc.runtime.json"

        # PyYAML は ubuntu-latest にプリインストールされているため，既定では何もしない．
        # caller が pyyaml-version を明示した場合のみ pip install で固定する（再現性向上）．
        # PyYAML は generate-textlint-runtime.py の allowlist 読込でのみ必要．
        if [ -n "${PYYAML_VERSION}" ]; then
          echo "Installing PyYAML==${PYYAML_VERSION} for reproducibility"
          python3 -m pip install --quiet --user "pyyaml==${PYYAML_VERSION}"
        fi

        python3 "${ACTION_PATH}/../../../scripts/generate-textlint-runtime.py" \
          "${SRC}" "${PRH}" "${DEST}" "${ALLOWLIST}" "${PRH_EXTRA}"
        echo "config=${DEST}" >> "${GITHUB_OUTPUT}"

    - name: Generate runtime markdownlint config without outputFormatters
      # caller config の outputFormatters は既定 formatter を置き換える（併存しない）．
      # 既定出力（`path:line[:col] RULE 説明`）には reviewdog への errorformat 入力と
      # summary 集計（scripts/count-lint-findings.py）が依存しており，置き換えられると
      # lint が走って違反があっても inline・summary とも 0 件になる（Issue #122）．
      # キーがあるときだけ除去済み runtime config を生成し，::warning:: で caller に
      # 知らせる．無いときは解決済みパスをそのまま使う（パススルー．既存 caller の
      # 挙動は不変）．runtime は src と同じディレクトリへ生成する．cli2 は
      # customRules / markdownItPlugins 等の相対パスを config ファイルのディレクトリ
      # 基準で解決するため，RUNNER_TEMP へ退避すると caller の独自ルールが読めなく
      # なる（PR #129 の Codex 指摘）．ファイル名は mkstemp の一意名
      # （.gh-workflows-runtime-*.markdownlint-cli2.yaml）とし caller 所有の
      # ファイルを上書きしない．suffix は cli2 の --config が受理する規約に合わせる．
      # 除去はトップレベルキーのテキスト除去で行い，PyYAML 往復による YAML 1.1
      # スカラー型崩れ（on / yes の bool 化等）を避ける（いずれも同レビュー指摘）．
      # 生成物は末尾の always() クリーンアップステップが generated output を
      # 見て削除する（ワークスペース非汚染．中間ステップの失敗でも残置しない）．
      # 採用パスの分岐もスクリプト側が GITHUB_OUTPUT へ書く．pytest で全経路を検証済み．
      # PyYAML は ubuntu-latest プリインストール．pyyaml-version input による固定は
      # 前段の textlint runtime ステップが済ませている．
      id: mdlint_runtime
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        SRC: ${{ steps.cfg.outputs.mdlint }}
      run: |
        set -euo pipefail
        python3 "${ACTION_PATH}/../../../scripts/generate-mdlint-runtime.py" "${SRC}"

    - name: Setup Node.js
      # actions/setup-node v6.4.0
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install lint dependencies (isolated in tmpdir)
      # 一時ディレクトリで install することで caller の node_modules / package.json を汚染しない．
      # markdownlint-cli2 と textlint 一式を同じ package-lock.json で管理する（Issue #121）．
      # 以前 markdownlint-cli2 は `npx -y -p markdownlint-cli2@^0.13.0` の floating semver で
      # 実行のたびに registry から解決していたが，未レビューの新版が caller runner 上で
      # 走りうるため lockfile 固定へ移行した．
      #
      # textlint-filter-rule-comments は中央 .textlintrc.json の filters.comments: true に対応する
      # 必須依存．これが install されていないと @textlint/config-loader の loadFilterRules で
      # ReferenceError が発生し，TextlintrcLoader.js が ok:false を受けて空 rule で fallback する．
      # 結果として rules セクションも含めて全 rule が silent に破棄され "No rules found" になる．
      #
      # package.json / package-lock.json を action ディレクトリから tmpdir にコピーして npm ci を
      # 実行する．これにより registry の状態に依存しない再現可能なインストールを保証する．
      # バージョン更新は Dependabot（.github/dependabot.yml の npm エコシステム設定）が追跡する．
      id: lint_install
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: bash "${ACTION_PATH}/../../../scripts/install-lint-deps.sh"

    - name: Run markdownlint (markdownlint-cli2)
      # markdownlint の実行は markdownlint-cli2 の 1 回へ統一する（Issue #117）．
      # 以前は reviewdog/action-markdownlint（markdownlint-cli v0.41.0）と
      # markdownlint-cli2 の 2 系統が走っていたが，cli は cli2 形式の設定
      # （config: / globs: / ignores: キー）を解釈できず，無効化済み規則の
      # 誤検出をそのまま PR へ inline 投稿していた．本ステップの結果テキストを
      # reviewdog への入力（次々ステップ）と summary 集計
      # （scripts/count-lint-findings.py）の両方で使う．
      # 出力の各 finding 行は `path:line[:col] RULE/...` 形式である．
      # PR イベント限定にしない（textlint ステップと同じ扱い）．非 PR では
      # reviewdog が投稿先を持たないだけで，lint 実行自体はログとして有用．
      id: mdlint_report
      shell: bash
      env:
        MDLINT_CFG: ${{ steps.mdlint_runtime.outputs.config }}
        MARKDOWN_GLOB: ${{ inputs.markdown-glob }}
        LINT_BIN: ${{ steps.lint_install.outputs.bin }}
      run: |
        set -uo pipefail
        # 「実行失敗」と「指摘あり」を区別する（textlint ステップと同方針）．
        # cli2 は指摘ありのとき exit 1 で終了する．一方，設定不正等の実行失敗も
        # exit 1 を返しうるため，終了コードだけでは区別できない．cli2 は起動に
        # 成功すると必ず banner 行（markdownlint-cli2 vX.Y.Z）を出力するので，
        # 「exit 1 かつ banner あり」だけを指摘ありの正常系として扱い，
        # それ以外の非ゼロ終了は step を失敗させる．
        MDLINT_EXIT=0
        "${LINT_BIN}/markdownlint-cli2" \
          --config "${MDLINT_CFG}" \
          "${MARKDOWN_GLOB}" "#node_modules" \
          > markdownlint-report.txt 2>&1 || MDLINT_EXIT=$?
        if [ "${MDLINT_EXIT}" -ne 0 ]; then
          if [ "${MDLINT_EXIT}" -ne 1 ] || \
             ! grep -q '^markdownlint-cli2 v' markdownlint-report.txt; then
            echo "::group::markdownlint output (exit=${MDLINT_EXIT})"
            cat markdownlint-report.txt
            echo "::endgroup::"
            echo "::error::markdownlint-cli2 exited with ${MDLINT_EXIT} and does not look like a findings run; treating as execution failure"
            exit "${MDLINT_EXIT}"
          fi
        fi
        # 「本当に 0 件」と「glob が 1 ファイルも拾わなかった」をログで切り分け
        # られるようにする（Issue #118）．全出力をレポートへ落とす設計のため，
        # ここで要点だけをログへ写す．Linting 行が走査ファイル数，Summary 行が
        # 指摘件数を示す．どちらも無い場合は既知の出力形式と異なるため警告する．
        echo "markdownlint-report.txt: $(wc -l < markdownlint-report.txt) lines (exit=${MDLINT_EXIT})"
        grep -E '^(Linting|Summary): ' markdownlint-report.txt \
          || echo "::warning::markdownlint-cli2 output has no Linting/Summary lines; report may be malformed"

    - name: Setup reviewdog
      # reviewdog/action-setup v1.5.0
      uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f
      with:
        # reviewdog 本体は再現性のため tag を固定．Dependabot の対象外なため version up は別 issue で扱う．
        reviewdog_version: v0.21.0

    - name: Report markdownlint findings with reviewdog
      # markdownlint-report.txt を errorformat で reviewdog へ流し込み，PR の
      # inline コメントとして投稿する．finding 行は `path:line[:col] RULE 説明`
      # 形式のため，列ありと列なしの 2 つの -efm で受ける．banner・Summary 等の
      # 非 finding 行はどちらにも一致せず無視される．
      # -fail-on-error の使い方は後続の textlint ステップと揃える．
      shell: bash
      env:
        REVIEWDOG_GITHUB_API_TOKEN: ${{ inputs.github-token }}
        RD_LEVEL: ${{ inputs.level }}
        RD_FILTER_MODE: ${{ inputs.filter-mode }}
        RD_FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
      run: |
        set -uo pipefail
        # 実行ステップが失敗すれば job ごと止まるため通常ここへ到達するが，
        # 防御的にレポート欠如でも reviewdog 呼び出しを壊さないでおく．
        [ -f markdownlint-report.txt ] || : > markdownlint-report.txt
        reviewdog \
          -efm="%f:%l:%c %m" \
          -efm="%f:%l %m" \
          -name="markdownlint" \
          -reporter=github-pr-review \
          -level="${RD_LEVEL}" \
          -fail-on-error="${RD_FAIL_ON_ERROR}" \
          -filter-mode="${RD_FILTER_MODE}" \
          < markdownlint-report.txt

    - name: Run textlint with reviewdog
      shell: bash
      env:
        REVIEWDOG_GITHUB_API_TOKEN: ${{ inputs.github-token }}
        TEXTLINT_CONFIG: ${{ steps.textlint_runtime.outputs.config }}
        TEXTLINT_IGNORE: ${{ steps.cfg.outputs.textlint_ignore }}
        MARKDOWN_GLOB: ${{ inputs.markdown-glob }}
        RD_LEVEL: ${{ inputs.level }}
        RD_FILTER_MODE: ${{ inputs.filter-mode }}
        RD_FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        TEXTLINT_BIN: ${{ steps.lint_install.outputs.bin }}
        TEXTLINT_MODULES: ${{ steps.lint_install.outputs.modules }}
      run: |
        set -uo pipefail
        # NODE_PATH に tmpdir/node_modules を加えて，textlint の require が rule package を
        # CommonJS 解決経路で引けるようにする．caller の既存 node_modules があってもそちらを
        # 優先する仕様のため上書き汚染しない．
        export NODE_PATH="${TEXTLINT_MODULES}:${NODE_PATH:-}"
        # textlint は指摘を見つけると非ゼロ終了する．GitHub Actions の bash は -e 付きで起動するため
        # 終了コードは `|| TEXTLINT_EXIT=$?` で捕捉し，後続の reviewdog に渡せるようにする．
        # --ignore-path は明示パスを指定する．textlint の既定は cwd の .textlintignore のみ
        # 探索するため，caller に置かれていない場合は中央 templates/.textlintignore を採用する．
        TEXTLINT_EXIT=0
        "${TEXTLINT_BIN}/textlint" -f checkstyle --config "${TEXTLINT_CONFIG}" \
          --ignore-path "${TEXTLINT_IGNORE}" "${MARKDOWN_GLOB}" \
          > textlint-report.xml 2> textlint-stderr.log || TEXTLINT_EXIT=$?
        if [ -s textlint-stderr.log ]; then
          echo "::group::textlint stderr (exit=${TEXTLINT_EXIT})"
          cat textlint-stderr.log
          echo "::endgroup::"
        fi
        # 「実行失敗」と「指摘なし」を区別する．
        # textlint は指摘ありで非ゼロ終了するが，その場合は checkstyle XML に findings が書かれている．
        # 一方 rule 解決失敗等の execution error では report が空のまま非ゼロ終了するため，
        # `exit != 0 かつ report が空` のケースだけ step 自体を失敗扱いにする．
        if [ "${TEXTLINT_EXIT}" -ne 0 ] && [ ! -s textlint-report.xml ]; then
          echo "::error::textlint exited with ${TEXTLINT_EXIT} and produced no report; treating as execution failure"
          exit "${TEXTLINT_EXIT}"
        fi
        # 「指摘なし」のケース（exit=0 かつ report が空）では reviewdog parse error 回避のため
        # 最小限の空 checkstyle XML を補う．
        if [ ! -s textlint-report.xml ]; then
          echo '<?xml version="1.0" encoding="UTF-8"?><checkstyle version="4.3"></checkstyle>' > textlint-report.xml
        fi
        reviewdog \
          -f=checkstyle \
          -name="textlint" \
          -reporter=github-pr-review \
          -level="${RD_LEVEL}" \
          -fail-on-error="${RD_FAIL_ON_ERROR}" \
          -filter-mode="${RD_FILTER_MODE}" \
          < textlint-report.xml

    - name: List PR diff files (for summary scoping)
      # lint summary の集計対象を PR 差分ファイルのみに絞るための入力を
      # 用意する（Issue #59: markdown-glob（既定 **/*.md）はリポジトリ全体を
      # 走査するため，reviewdog の filter-mode（inline コメントのみを diff
      # 行に絞る機構）と summary 集計の対象範囲が一致せず，diff に含まれない
      # ファイルの指摘まで summary に出てしまっていた）．
      #
      # 取得失敗時は ::warning:: を出し非 0 終了する（scripts/list-pr-diff-files.sh
      # 側の設計）．continue-on-error で吸収し，後続ステップでは
      # steps.diff_files.outputs.path が空のまま渡らないため，summary は
      # 従来どおりリポジトリ全体スコープにフォールバックする（fail-open）．
      #
      # ガード条件は「Post lint summary comment to PR」と揃える．
      id: diff_files
      if: |
        always() &&
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        inputs.post-summary == 'true'
      shell: bash
      continue-on-error: true
      env:
        ACTION_PATH: ${{ github.action_path }}
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set -uo pipefail
        # 後続の「Post lint summary comment to PR」ステップが読む cross-step
        # artifact のため，textlintrc.runtime.json と同じ規約で RUNNER_TEMP
        # 配下に絶対パスで置く（caller cwd 非依存・ワークスペース非汚染）．
        DIFF_FILES_PATH="${RUNNER_TEMP}/pr-diff-files.txt"
        if bash "${ACTION_PATH}/../../../scripts/list-pr-diff-files.sh" > "${DIFF_FILES_PATH}"; then
          echo "path=${DIFF_FILES_PATH}" >> "${GITHUB_OUTPUT}"
        else
          echo "::warning::Failed to list PR diff files; lint summary falls back to repo-wide scope"
          echo "path=" >> "${GITHUB_OUTPUT}"
        fi

    - name: Post lint summary comment to PR
      # reviewdog の github-pr-review reporter は findings ゼロのとき何も投稿
      # しないため，PR 上で「lint が走ったが指摘なし」 と「workflow が起動して
      # いない」 が判別できない．本ステップは件数の summary を hidden marker
      # 付き 1 コメントで upsert することでこの UX 欠落を補う．
      #
      # 失敗を fail-open にする責務は scripts/post-lint-summary.sh が持つ
      # （非 2xx は ::warning:: + exit 0）．reviewdog 本体は既に投稿済みの
      # ため UX nicety で job を落とさない方針．
      #
      # ガード条件:
      #   - always(): textlint / markdownlint が指摘ありで非ゼロ終了しても
      #     summary を出すために必要
      #   - pull_request イベントに限定: push 時は対象 PR が存在しない
      #   - 同一リポジトリからの PR に限定: fork からの PR では
      #     pull-requests: write が降格され API call が必ず失敗するため，
      #     reviewdog inline コメントの制約と整合させて事前に skip
      #   - inputs.post-summary == 'true': caller 側で opt-out したい場合は
      #     `post-summary: "false"` を渡すことで step 自体を skip できる．
      #     同一 PR で複数 job が並走し marker `<!-- gh-workflows-lint-summary -->`
      #     を奪い合うケースに使う（例：本リポジトリの self-test と caller 形式が
      #     共存するときの整理）
      if: |
        always() &&
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        inputs.post-summary == 'true'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        MARKDOWN_IGNORE: ${{ inputs.markdown-ignore }}
        DIFF_FILES_PATH: ${{ steps.diff_files.outputs.path }}
        # 検査対象コミットの併記用（Issue #119）．lint はマージコミット
        # （head を base へ merge した木）に対して走るため，全体件数の基準に
        # なった base を summary へ明示する．step は pull_request イベントに
        # ガード済みのため両 SHA は常に取れる想定だが，取れない場合は
        # post-lint-summary.sh 側が行ごと省略する（後方互換）．
        LINT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        LINT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -uo pipefail
        # ワークスペース非汚染のため RUNNER_TEMP 配下に置く（pr-diff-files.txt と同じ規約）．
        SUMMARY_JSON_PATH="${RUNNER_TEMP}/lint-summary.json"
        # markdown-ignore input が空でなければ改行区切りで複数 --ignore-glob を渡す．
        # 空行は無視．配列展開で空展開した場合に引数が落ちるよう ${arr[@]+...} を使う．
        IGNORE_ARGS=()
        if [ -n "${MARKDOWN_IGNORE}" ]; then
          while IFS= read -r line; do
            [ -n "$line" ] && IGNORE_ARGS+=(--ignore-glob "$line")
          done <<< "${MARKDOWN_IGNORE}"
        fi
        DIFF_FILES_ARGS=()
        if [ -n "${DIFF_FILES_PATH}" ]; then
          DIFF_FILES_ARGS=(--diff-files-from "${DIFF_FILES_PATH}")
        fi
        python3 "${ACTION_PATH}/../../../scripts/count-lint-findings.py" \
          textlint-report.xml markdownlint-report.txt \
          ${IGNORE_ARGS[@]+"${IGNORE_ARGS[@]}"} \
          ${DIFF_FILES_ARGS[@]+"${DIFF_FILES_ARGS[@]}"} > "${SUMMARY_JSON_PATH}"
        SUMMARY_JSON="${SUMMARY_JSON_PATH}" \
          bash "${ACTION_PATH}/../../../scripts/post-lint-summary.sh"

    - name: Clean up generated runtime config
      # outputFormatters 除去で生成した runtime config は caller config と同じ
      # ディレクトリ（多くは caller workspace）に置かれる．中間ステップの失敗や
      # キャンセルでも残置しないよう，always() の末尾ステップで削除する
      # （PR #129 の Codex 指摘．self-hosted runner での蓄積と，後続 always()
      # ステップからの観測を防ぐ）．パススルー時は空文字で何もしない．
      # ハードキャンセルで always() 自体が走らないケースは残るが，同名の
      # 一意ファイルは次回 run で再利用されないため実害は蓄積のみに限られる．
      if: always()
      shell: bash
      env:
        MDLINT_GENERATED: ${{ steps.mdlint_runtime.outputs.generated }}
      run: |
        set -uo pipefail
        if [ -n "${MDLINT_GENERATED:-}" ]; then rm -f "${MDLINT_GENERATED}"; fi