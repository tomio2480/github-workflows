name: Self test (composite action)

# composite action の TDD 検証用 CI workflow．
#
# 7 jobs:
#   - unit-python: scripts/*.py の pytest
#   - unit-bash: scripts/*.sh の bats
#   - shell-quality-reusable: reusable workflow の tool setup と caller contract
#   - shell-quality-self: 本リポジトリのシェル資産に対する repo-local gate
#   - integration-action: ./.github/actions/markdown-lint を fixture に対して走らせる
#   - integration-session-url-check: ./.github/actions/session-url-check を本 PR に対して走らせる
#   - integration-workflow-lint: ./.github/actions/workflow-lint を本リポジトリへ走らせる
#
# shell-quality-reusable と shell-quality-self は役割が異なるため統合しない．
# 前者は fixture で caller contract を検証し，後者は本リポジトリ自身の
# scripts/*.sh・bin/*.sh・bin/*.ps1 を実際に検査する．
#
# integration-action は reviewdog で PR inline コメントを投稿するため pull_request のみで動く．
# 「指摘ゼロ」 ケースは scripts/count-lint-findings.py の pytest と
# scripts/post-lint-summary.sh の bats で網羅し，self-PR では「指摘あり混在」
# fixture に対する upsert 挙動だけを目視確認する（同一 PR で複数 job が
# 同じ marker を upsert すると race するため，integration は単一 job に
# 絞る）．

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  shell-quality-reusable:
    name: Reusable Shell quality workflow
    uses: ./.github/workflows/shell-quality.yml
    with:
      verify-script: tests/fixtures/shell-quality/verify-shell.py

  shell-quality-self:
    name: Repo-local Shell quality gate
    uses: ./.github/workflows/shell-quality.yml
    with:
      verify-script: bin/verify-shell.py
      # 5.1 依存の Pester ケースは ubuntu では skip される（Issue #184）
      windows-verify: true

  unit-python:
    name: Python script unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Install pytest
        run: pip install -r tests/python/requirements.txt

      - name: Run pytest
        run: python -m pytest tests/python -v

  unit-bash:
    name: Bash script unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Run bats
        run: bats tests/bash

  integration-action:
    name: Composite action integration on fixtures
    runs-on: ubuntu-latest
    needs:
      - unit-python
      - unit-bash
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run composite action against fixtures
        # self-test は fixture に対する lint を確認することが目的．caller-style の
        # md-lint.yml と同一 PR で並走したときに summary marker を奪い合わない
        # よう post-summary は false に切る．
        uses: ./.github/actions/markdown-lint
        with:
          markdown-glob: "tests/fixtures/markdown/**/*.md"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fail-on-error: "false"
          post-summary: "false"

      - name: Download uploaded lint reports
        # Issue #148: 生レポートが artifact として取得できることを実機で確認する．
        # 既定の artifact 名は `lint-reports-<job id>` のため本 job では
        # `lint-reports-integration-action` になる．
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lint-reports-integration-action
          path: downloaded-reports

      - name: Assert lint reports are retrievable
        # 内訳が取れることまで見る．fixture には意図的な違反があるため，
        # markdownlint のレポートは必ず 1 件以上の指摘行を含む．
        shell: bash
        run: |
          set -euo pipefail
          ls -l downloaded-reports
          test -s downloaded-reports/markdownlint-report.txt
          test -s downloaded-reports/textlint-report.xml
          grep -qE ':[0-9]+ MD[0-9]{3}' downloaded-reports/markdownlint-report.txt
          grep -q '<checkstyle' downloaded-reports/textlint-report.xml

  integration-session-url-check:
    name: Session URL check on this PR
    runs-on: ubuntu-latest
    needs:
      - unit-bash
    if: github.event_name == 'pull_request'
    # 読み取りしか行わないため，workflow レベルの pull-requests: write を job で絞る．
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run composite action against this PR
        # 本リポジトリの PR 自身を対象にする．期待値は検出なし（exit 0）である．
        # 検出ありのケースは tests/bash/check-session-url.bats が fake gh で網羅する．
        uses: ./.github/actions/session-url-check
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  integration-workflow-lint:
    name: Workflow lint on this repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - unit-python
    # 上流への読み取りしか行わない．workflow レベルの pull-requests: write は
    # 要らないため，job では contents: read だけへ絞る．
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run composite action against this repository
        # 配布する composite action を，中央自身の workflow と templates/ へ当てる．
        # templates/ は Dependabot の走査対象外のため，pin が取り残されやすい
        # （Issue #156）．上流突合まで通すことで，取り残しをここで拾う．
        uses: ./.github/actions/workflow-lint
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pin-globs: |
            .github/workflows/*.yml
            .github/actions/*/action.yml
            templates/**/*.yml
