name: Reusable Shell Quality

on:
  workflow_call:
    inputs:
      verify-script:
        description: Repo-local Shell quality gate の path
        required: false
        type: string
        default: bin/verify-shell.py
      python-version:
        description: verify script を実行する Python version
        required: false
        type: string
        default: "3.x"
      windows-verify:
        description: >-
          PowerShell の検査を windows runner でも実行するか．
          有効にする caller は verify script が --powershell-only を解する必要がある．
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: Shell / CLI quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install ShellCheck, shfmt, and Bats
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$(mktemp -d)"
          trap 'rm -rf "${tool_dir}"' EXIT

          curl -fsSLo "${tool_dir}/shellcheck.tar.xz" \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  ${tool_dir}/shellcheck.tar.xz" \
            | sha256sum --check --strict
          tar -xJf "${tool_dir}/shellcheck.tar.xz" -C "${tool_dir}"
          sudo install "${tool_dir}/shellcheck-v0.11.0/shellcheck" /usr/local/bin/shellcheck

          curl -fsSLo "${tool_dir}/shfmt" \
            https://github.com/mvdan/sh/releases/download/v3.13.1/shfmt_v3.13.1_linux_amd64
          echo "fb096c5d1ac6beabbdbaa2874d025badb03ee07929f0c9ff67563ce8c75398b1  ${tool_dir}/shfmt" \
            | sha256sum --check --strict
          sudo install "${tool_dir}/shfmt" /usr/local/bin/shfmt

          # bats-core v1.14.0．GitHub の自動生成 archive に依存せず commit SHA を取得する．
          bats_sha="eb7f42f8d608ac693d7a4b67474f6714ea68cfc5"
          bats_dir="${tool_dir}/bats-core"
          git init --quiet "${bats_dir}"
          git -C "${bats_dir}" remote add origin https://github.com/bats-core/bats-core.git
          git -C "${bats_dir}" fetch --quiet --depth=1 origin "${bats_sha}"
          git -C "${bats_dir}" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "${bats_dir}" rev-parse HEAD)" = "${bats_sha}"
          sudo bash "${bats_dir}/install.sh" /usr/local

      - name: Install PowerShell analyzers and tests
        shell: pwsh
        run: |
          # PSGallery が未登録の runner に当たることがある（Issue #205）．
          # `Set-PSRepository` は登録済みを前提とするため，そこで落ちていた．
          # 信頼確認は `Install-Module -Force` が抑えるため，登録だけを補う．
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
            Register-PSRepository -Default
          }
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          Install-Module Pester -RequiredVersion 6.1.0 -Scope CurrentUser -Force
          # 意図した版が実際に入ったことを確かめる．pwsh 7 は native command の
          # 非 0 終了で停止しないため，`Install-Module` の内側が呼ぶ native
          # command の失敗はエラーとして飛ばないことがある．「エラーが飛ばな
          # かった」を成功の根拠にすると，入っていない状態を成功と読む．
          $required = @{ PSScriptAnalyzer = '1.25.0'; Pester = '6.1.0' }
          foreach ($name in $required.Keys) {
            $found = Get-Module -ListAvailable -Name $name |
              Where-Object { $_.Version -eq [version]$required[$name] }
            if (-not $found) {
              throw "$name $($required[$name]) を導入できていない"
            }
          }
          # `Register-PSRepository -Default` は windows runner で内部の
          # `nuget.exe` が異常終了し `$LASTEXITCODE` へ 1 を残す．登録自体は
          # 成功しているが，runner の pwsh は最後の `$LASTEXITCODE` を step の
          # 終了コードへ伝播する．明示的に戻さないと，成功したまま落ちる．
          # 上の突き合わせを通った後にのみ戻す．
          $global:LASTEXITCODE = 0

      - name: Run repo-local Shell quality gate
        env:
          VERIFY_SCRIPT: ${{ inputs.verify-script }}
        shell: bash
        run: python "${VERIFY_SCRIPT}" --require-all

  # Windows PowerShell 5.1 を要するテストは ubuntu では skip される．
  # 5.1 は windows runner へ既定で入っているため，PowerShell の検査だけを
  # ここで再実行する．bash 側の toolchain は載せない（Issue #184）．
  verify-windows:
    name: Shell / CLI quality (Windows PowerShell)
    if: ${{ inputs.windows-verify }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install PowerShell analyzers and tests
        shell: pwsh
        run: |
          # PSGallery が未登録の runner に当たることがある（Issue #205）．
          # `Set-PSRepository` は登録済みを前提とするため，そこで落ちていた．
          # 信頼確認は `Install-Module -Force` が抑えるため，登録だけを補う．
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
            Register-PSRepository -Default
          }
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          Install-Module Pester -RequiredVersion 6.1.0 -Scope CurrentUser -Force
          # 意図した版が実際に入ったことを確かめる．pwsh 7 は native command の
          # 非 0 終了で停止しないため，`Install-Module` の内側が呼ぶ native
          # command の失敗はエラーとして飛ばないことがある．「エラーが飛ばな
          # かった」を成功の根拠にすると，入っていない状態を成功と読む．
          $required = @{ PSScriptAnalyzer = '1.25.0'; Pester = '6.1.0' }
          foreach ($name in $required.Keys) {
            $found = Get-Module -ListAvailable -Name $name |
              Where-Object { $_.Version -eq [version]$required[$name] }
            if (-not $found) {
              throw "$name $($required[$name]) を導入できていない"
            }
          }
          # `Register-PSRepository -Default` は windows runner で内部の
          # `nuget.exe` が異常終了し `$LASTEXITCODE` へ 1 を残す．登録自体は
          # 成功しているが，runner の pwsh は最後の `$LASTEXITCODE` を step の
          # 終了コードへ伝播する．明示的に戻さないと，成功したまま落ちる．
          # 上の突き合わせを通った後にのみ戻す．
          $global:LASTEXITCODE = 0

      - name: Run repo-local Shell quality gate (PowerShell only)
        env:
          VERIFY_SCRIPT: ${{ inputs.verify-script }}
        shell: bash
        run: python "${VERIFY_SCRIPT}" --require-all --powershell-only
